# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=26.1.0.0
group=com.hbm
java_version=25

# Common
minecraft_version=26.1
mod_name=hbm
mod_author=Jared
mod_id=hbm
license=CC0-1.0
credits=
description=The description of your mod. \nAccepts multilines.
minecraft_version_range=[26.1, 26.2)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.154.2+26.1.2
fabric_loader_version=0.18.4

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.1.0.19-beta
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# JEI (Just Enough Items) — compiled against (the `*-api` artifacts) and loaded in the dev runs
# (the full loader jars). Published per MC version, and its neoforge build hard-requires
# neoforge >= 26.1.0.8-beta. See https://maven.blamejared.com/mezz/jei/ for new versions.
jei_mc_version=26.1
jei_version=29.2.0.21

# Sodium — client-only dev rendering mod. Added ONLY to the dev client run's runtime classpath
# (never compiled against, never bundled into the release jar). Fill in a Sodium build that matches
# this Minecraft version (see https://modrinth.com/mod/sodium/versions); leave empty to disable.
# The value is the Modrinth version number, e.g. 'mc26.1-0.6.0-fabric' / 'mc26.1-0.6.0-neoforge'.
sodium_fabric_version=mc26.1.1-0.8.9-fabric
sodium_neoforge_version=mc26.1.1-0.8.9-neoforge
