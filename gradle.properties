# Root defaults. Values marked [VERSIONED] are overridden per node in
# versions/<node>/gradle.properties — a node that needs a different value MUST declare it there.

org.gradle.jvmargs=-Xmx3G -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod identity
mod.id=hbm
mod.name=NTM - Continuum
mod.group=com.hbm
mod.version=0.1.0
mod.author=Golem
mod.license=LGPL-3.0
mod.credits=Based on HBM's Nuclear Tech Mod for 1.7.10 by HbMinecraft and its contributors (LGPL-3.0).
mod.description=HBM's Nuclear Tech Mod.

# Golem Core, the cross-version API layer this mod is built on.
deps.golemcore=0.1.0

# Golem Core's shared build layer (../Golem-Core/gradle/mod/*.gradle.kts, applied by each loader buildscript).
# HBM's data for it; each script documents its parameters in its header. Lists are comma-separated.
# Dejson: the declaration classes, in initialisation order, and the reviewed list of hand-tuned authored JSON.
golem.build.dejson.classes=gradle/dejson-classes.txt
golem.build.dejson.authored=gradle/dejson-authored.txt
# Blender-exported animation and scene data under models/ (not models at all), so not Dejson's to own.
golem.build.dejson.unownedFolders=assets/hbm/models/anim/,assets/hbm/models/doors/,assets/hbm/models/weapons/
# Below 1.21.4: the select properties Core's ItemModelProperties installs as legacy float predicates
# (hbm:model_state is the ModelState component; hbm:coltass and hbm:polaroid are client-state selects, the
# Coltass needle frame and the Polaroid's roll), and the minecraft:special inner types drawn by HBM's own
# item renderer (machine OBJ and the RBMK columns).
golem.build.legacyAssets.selectProperties=hbm:model_state,hbm:coltass,hbm:polaroid
golem.build.legacyAssets.selfRenderedSpecialTypes=hbm:machine_obj,hbm:rbmk_fuel_column,hbm:rbmk_block_column
# -PgunSmokeTest / -Dhbm.gunSmokeTest reach the client run as -Dhbm.gunSmokeTest.
golem.build.runToolchain.clientFlags=gunSmokeTest=hbm.gunSmokeTest

# [VERSIONED] Per-node values
deps.minecraft=[VERSIONED]
deps.minecraft_range=[VERSIONED]
java_version=[VERSIONED]
pack_format=[VERSIONED]

deps.fabric_loader=[VERSIONED]
deps.fabric_api=[VERSIONED]

deps.neoforge=[VERSIONED]
deps.neoforge_loader_range=[VERSIONED]

deps.forge=[VERSIONED]
deps.forge_loader_range=[VERSIONED]

# JEI: compiled against the `*-api` artifacts, and the full loader jar is added to the dev run's
# runtime classpath only — never bundled, so JEI stays an optional install-time dependency.
deps.jei_mc=[VERSIONED]
deps.jei=[VERSIONED]

# Published Flywheel is optional on 1.20.1/1.21.1; 26.1 NeoForge uses Golem Core's vendored engine.
deps.flywheel=[VERSIONED]

# Sodium: client-only dev rendering mod, added ONLY to the dev client run's runtime classpath.
# The value is the Modrinth version number. Leave empty to disable.
deps.sodium_fabric=[VERSIONED]
deps.sodium_neoforge=[VERSIONED]
# Embeddium: the Forge port of Sodium, and the only one of the family that runs on Forge 1.20.1
# (Sodium itself has no Forge build; NeoForge nodes use Sodium directly). Same rules as above —
# Modrinth version number, dev client run only, blank to disable.
deps.embeddium=[VERSIONED]

# Pipez: a third-party energy mod on the dev runtime, so the foreign-energy bridge is exercised against
# a real peer rather than only against our own facades meeting at the capability. It is the one energy
# mod published for all three forge-like nodes with no required dependencies of its own, and it spans
# all three capability eras — 26.1's transactional EnergyHandler, 1.21.1's IEnergyStorage, and 1.20.1's
# AttachCapabilitiesEvent. Modrinth version number; dev runtime only, never bundled; blank to disable,
# which also skips the gametests that drive it.
deps.pipez=[VERSIONED]

# Fabric Loom version, applied to whichever variant loom-back-compat selects for the node.
loomx.loom_version=1.16.3

# LWJGL pin. Loom force-upgrades LWJGL on old Minecraft when the Gradle JVM is Java 19+, which makes
# the dev client run a different native stack than players do. Set this to the version the target
# Minecraft actually ships to undo that; leave blank to accept Loom's choice.
deps.lwjgl=[VERSIONED]

# Release upload (../Golem-Core/gradle/mod/publish.gradle.kts documents every key). A blank project id skips that
# site. Tokens come from MODRINTH_TOKEN / CURSEFORGE_TOKEN or ~/.gradle/gradle.properties, never from this file.
golem.build.publish.modrinthProject=ntm-continuum
golem.build.publish.curseforgeProject=1719328
golem.build.publish.requires=golem-core
golem.build.publish.fabricRequires=fabric-api
