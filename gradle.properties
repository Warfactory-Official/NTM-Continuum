# Root defaults. Values marked [VERSIONED] are overridden per node in
# versions/<node>/gradle.properties — a node that needs a different value MUST declare it there.

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# Mod identity
mod.id=hbm
mod.name=hbm
mod.group=com.hbm
mod.version=0.1.0
mod.author=Jared
mod.license=CC0-1.0
mod.credits=
mod.description=HBM's Nuclear Tech Mod.

# Golem Core, the cross-version API layer this mod is built on.
deps.golemcore=0.1.0

# [VERSIONED] Per-node values
deps.minecraft=[VERSIONED]
deps.minecraft_range=[VERSIONED]
java_version=[VERSIONED]
pack_format=[VERSIONED]

deps.fabric_loader=[VERSIONED]
deps.fabric_api=[VERSIONED]

deps.neoforge=[VERSIONED]
deps.neoforge_loader_range=[VERSIONED]

deps.forge=[VERSIONED]
deps.forge_loader_range=[VERSIONED]

# JEI: compiled against the `*-api` artifacts, and the full loader jar is added to the dev run's
# runtime classpath only — never bundled, so JEI stays an optional install-time dependency.
deps.jei_mc=[VERSIONED]
deps.jei=[VERSIONED]

# Sodium: client-only dev rendering mod, added ONLY to the dev client run's runtime classpath.
# The value is the Modrinth version number. Leave empty to disable.
deps.sodium_fabric=[VERSIONED]
deps.sodium_neoforge=[VERSIONED]
# Embeddium: the Forge port of Sodium, and the only one of the family that runs on Forge 1.20.1
# (Sodium itself has no Forge build; NeoForge nodes use Sodium directly). Same rules as above —
# Modrinth version number, dev client run only, blank to disable.
deps.embeddium=[VERSIONED]

# Fabric Loom version, applied to whichever variant loom-back-compat selects for the node.
loomx.loom_version=1.16.3

# LWJGL pin. Loom force-upgrades LWJGL on old Minecraft when the Gradle JVM is Java 19+, which makes
# the dev client run a different native stack than players do. Set this to the version the target
# Minecraft actually ships to undo that; leave blank to accept Loom's choice.
deps.lwjgl=[VERSIONED]
