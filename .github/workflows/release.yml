# Publishes a release: builds every node of Golem Core and HBM and uploads all their jars to Modrinth and
# CurseForge (Golem-Core/gradle/mod/publish.gradle.kts), then attaches them to a GitHub release.
#
# Trigger it by pushing a tag that matches mod.version in gradle.properties:
#     git tag -a v0.2.0 -m "changelog text"        -> release
#     git tag -a v0.2.0-beta.1 -m "changelog text" -> beta   (alpha likewise)
#     git push origin v0.2.0
# The changelog is the "## <version>" section of CHANGELOG.md, else the tag message. Golem Core uses its own
# CHANGELOG.md the same way. Or run it from the Actions tab (workflow_dispatch).
#
# Repository secrets: MODRINTH_TOKEN, CURSEFORGE_TOKEN (and GOLEM_CORE_TOKEN while Golem Core is private).
# Golem Core is uploaded only when its mod.version is not on Modrinth yet, so an unchanged Golem Core is
# never uploaded twice.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      type:
        description: Release type
        type: choice
        options: [beta, alpha, release]
        default: beta
      changelog:
        description: Changelog (blank uses this version's section of CHANGELOG.md)
        default: ''
      golem_ref:
        description: Golem Core branch, tag or commit to build against
        default: main
      publish_golem:
        description: Also publish Golem Core (still skipped if this version is already on Modrinth)
        type: boolean
        default: true
      dry_run:
        description: Dry run (build and log the uploads, upload nothing)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      # ModDevGradle builds Minecraft through its binary pipeline whenever CI=true (GitHub always sets it).
      # That jar keeps Forge's signature digests over remapped classes and loses parameter names, so build
      # with the local recompile pipeline (same as prerelease.yml).
      CI: "false"
    steps:
      # settings.gradle.kts includes ../Golem-Core as a composite build: check both out side by side.
      - uses: actions/checkout@v4
        with:
          path: new-hbm

      - uses: actions/checkout@v4
        with:
          repository: Warfactory-Official/Golem-Core
          ref: ${{ inputs.golem_ref || 'main' }}
          path: Golem-Core
          token: ${{ secrets.GOLEM_CORE_TOKEN || github.token }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Release settings
        id: cfg
        env:
          INPUT_TYPE: ${{ inputs.type }}
          INPUT_CHANGELOG: ${{ inputs.changelog }}
          INPUT_GOLEM: ${{ inputs.publish_golem }}
          INPUT_DRY: ${{ inputs.dry_run }}
        run: |
          prop() { grep -E "^$2=" "$1/gradle.properties" | cut -d= -f2- | tr -d '[:space:]'; }
          version=$(prop new-hbm mod.version)
          golem_version=$(prop Golem-Core mod.version)
          changelog="$RUNNER_TEMP/changelog.md"
          : > "$changelog"

          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"
            case "$tag" in
              "v$version"|"v$version"-*) ;;
              *) echo "::error::Tag $tag does not match mod.version $version in gradle.properties"; exit 1 ;;
            esac
            case "$tag" in *alpha*) type=alpha ;; *beta*|*pre*|*rc*) type=beta ;; *) type=release ;; esac
            # actions/checkout fetches the tag as a lightweight ref; fetch the annotated object for its message.
            git -C new-hbm fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            git -C new-hbm tag -l --format='%(contents)' "$tag" | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > "$changelog"
            golem=true; dry=false
          else
            tag="v$version"
            type="$INPUT_TYPE"
            printf '%s\n' "$INPUT_CHANGELOG" > "$changelog"
            golem="$INPUT_GOLEM"; dry="$INPUT_DRY"
          fi
          # This version's "## <version>" section of CHANGELOG.md wins over the tag message; typed text wins over both.
          if [ -f new-hbm/CHANGELOG.md ] && { [ "$GITHUB_EVENT_NAME" = push ] || [ -z "$INPUT_CHANGELOG" ]; }; then
            awk -v v="$version" '
              /^## / { h=$2; gsub(/[][]/, "", h); sub(/^v/, "", h); if (on) exit; on = (h == v); next }
              on' new-hbm/CHANGELOG.md > "$RUNNER_TEMP/section.md"
            if [ -n "$(tr -d '[:space:]' < "$RUNNER_TEMP/section.md")" ]; then mv "$RUNNER_TEMP/section.md" "$changelog"; fi
          fi
          # Blank: let the Gradle script fall back to CHANGELOG.md.
          if [ -z "$(tr -d '[:space:]' < "$changelog")" ]; then changelog=""; fi

          # Skip Golem Core when this version is already on Modrinth (re-uploading it would fail or duplicate).
          golem_mr=$(prop Golem-Core golem.build.publish.modrinthProject)
          if [ "$golem" = true ] && [ -n "$golem_mr" ]; then
            if curl -fsSL "https://api.modrinth.com/v2/project/$golem_mr/version" \
                 | jq -e --arg v "$golem_version+" 'any(.[]; .version_number | startswith($v))' > /dev/null; then
              echo "Golem Core $golem_version is already on Modrinth; not uploading it again."
              golem=false
            fi
          fi

          {
            echo "version=$version"; echo "tag=$tag"; echo "type=$type"
            echo "changelog=$changelog"; echo "golem=$golem"; echo "dry=$dry"
          } >> "$GITHUB_OUTPUT"
          echo "HBM $version ($type), tag $tag, Golem Core $golem_version upload=$golem, dry run=$dry"

      # Golem Core first: the obfuscated Fabric nodes refuse a Golem jar older than its sources.
      - name: Build Golem Core
        working-directory: Golem-Core
        run: bash ./gradlew chiseledBuild --no-daemon --stacktrace

      - name: Publish Golem Core
        if: steps.cfg.outputs.golem == 'true'
        working-directory: Golem-Core
        run: >
          bash ./gradlew publishAllMods --no-daemon --stacktrace
          -Ppublish.type=${{ steps.cfg.outputs.type }}
          -Ppublish.dryRun=${{ steps.cfg.outputs.dry }}

      - name: Build HBM
        working-directory: new-hbm
        run: bash ./gradlew chiseledBuild --no-daemon --stacktrace

      - name: Publish HBM
        working-directory: new-hbm
        env:
          CHANGELOG_FILE: ${{ steps.cfg.outputs.changelog }}
        run: |
          bash ./gradlew publishAllMods --no-daemon --stacktrace \
            -Ppublish.type=${{ steps.cfg.outputs.type }} \
            -Ppublish.dryRun=${{ steps.cfg.outputs.dry }} \
            ${CHANGELOG_FILE:+-Ppublish.changelogFile=$CHANGELOG_FILE}

      - name: Collect release jars
        if: steps.cfg.outputs.dry != 'true'
        run: |
          mkdir -p dist
          for repo in new-hbm Golem-Core; do
            find $repo/versions/*/build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;
          done
          ls -l dist

      - name: GitHub release
        if: steps.cfg.outputs.dry != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.cfg.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NTM - Continuum ${{ steps.cfg.outputs.version }}
          prerelease: ${{ steps.cfg.outputs.type != 'release' }}
          body_path: ${{ steps.cfg.outputs.changelog || '' }}
          generate_release_notes: ${{ steps.cfg.outputs.changelog == '' }}
          files: dist/*.jar
