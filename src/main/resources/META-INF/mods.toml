modLoader = "javafml"
loaderVersion = "${forge_loader_range}"
license = "${mod_license}"
issueTrackerURL = "@golem.issues@"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "@golem.homepage@"
logoFile = "assets/${mod_id}/icon.png"
authors = "${mod_author}"
description = '''${mod_description}@golem.credits@'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_loader_range}"
ordering = "NONE"
side = "BOTH"

# AFTER, not BEFORE — see the note in neoforge.mods.toml. `ordering` is this mod's position relative
# to the dependency, so BEFORE would construct hbm ahead of golemcore and leave its mod bus unset.
[[dependencies.${mod_id}]]
modId = "golemcore"
mandatory = true
versionRange = "[1.0.3,)"
ordering = "AFTER"
side = "BOTH"

# GemRender before 0.1.20 hangs the loading screen when another mod replaces a vanilla core shader.
[[dependencies.${mod_id}]]
modId = "gemrender"
mandatory = false
versionRange = "[0.1.20,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"
