deps.minecraft=1.21.1
deps.minecraft_range=[1.21.1, 1.22)
java_version=21
pack_format=34

deps.neoforge=21.1.248
deps.neoforge_loader_range=[4,)

# JEI is not wired up for this node yet (1.21.1 uses the JEI 19.x API line, which differs from 26.1's
# 29.x). Leaving these blank disables the integration for this node rather than blocking the target.
deps.jei_mc=1.21.1
deps.jei=19.44.0.401
# REI (Roughly Enough Items), an optional peer like JEI: compile-only (Core dev.golem.core.rei, HBM com.hbm.handler.rei),
# in dev runs only with -Prei.run=true. Blank disables it for this node (the `rei` constant).
deps.rei=16.0.799

deps.sodium_neoforge=mc1.21.1-0.8.12-neoforge
deps.flywheel=1.0.6-44
deps.pipez=neoforge-1.21.1-1.2.31

# CC: Tweaked, an optional peer: compiled against (peripherals, dev.golem.core.computer), never shipped or
# required. Blank
# disables the integration for this node (the `computercraft` constant).
deps.cc_mc=1.21.1
deps.cc=1.120.2

# Sable (moving block sub-levels, the engine under Create Aeronautics), an optional peer: compiled against
# (src/sable, com.hbm.compat.sable), never shipped or required. Blank disables it for this node.
deps.sable_mc=1.21.1
deps.sable=2.0.6
deps.sable_companion=1.6.0
# Dev-run mods for -Psable.run=true (Modrinth version numbers).
# Sable 2.0.6+mc1.21.1 by Modrinth version id: its NeoForge and Fabric builds share the version number.
deps.sable_run=fg9dTRz9
deps.create_run=6.0.10+mc1.21.1
deps.aeronautics_run=1.3.2+mc1.21.1
# Iris/Oculus for shader-pack testing, only with -Pshaders.run=true (matches this node's dev Sodium/Embeddium)
deps.iris=1.8.14-beta.1+1.21.1-neoforge
