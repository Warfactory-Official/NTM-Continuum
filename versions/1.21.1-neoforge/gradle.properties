deps.minecraft=1.21.1
deps.minecraft_range=[1.21.1, 1.22)
java_version=21
pack_format=34

deps.neoforge=21.1.248
deps.neoforge_loader_range=[4,)

# JEI is not wired up for this node yet (1.21.1 uses the JEI 19.x API line, which differs from 26.1's
# 29.x). Leaving these blank disables the integration for this node rather than blocking the target.
deps.jei_mc=1.21.1
deps.jei=19.44.0.401
# REI (Roughly Enough Items), an optional peer like JEI: compile-only (Core dev.golem.core.rei, HBM com.hbm.handler.rei),
# in dev runs only with -Prei.run=true. Blank disables it for this node (the `rei` constant).
deps.rei=16.0.799

deps.sodium_neoforge=mc1.21.1-0.8.12-neoforge
deps.gemrender=9302429
deps.gemrender_flywheel=
deps.pipez=neoforge-1.21.1-1.2.31

# CC: Tweaked, an optional peer: compiled against (peripherals, dev.golem.core.computer), never shipped or
# required. Blank
# disables the integration for this node (the `computercraft` constant).
deps.cc_mc=1.21.1
deps.cc=1.120.2

# Sable (moving block sub-levels, the engine under Create Aeronautics), an optional peer: compiled against
# (src/sable, com.hbm.compat.sable), never shipped or required. Blank disables it for this node.
deps.sable_mc=1.21.1
deps.sable=2.0.6
deps.sable_companion=1.6.0
# Dev-run mods for -Psable.run=true (Modrinth version numbers).
# Sable 2.0.6+mc1.21.1 by Modrinth version id: its NeoForge and Fabric builds share the version number.
deps.sable_run=fg9dTRz9
deps.create_run=6.0.10+mc1.21.1
deps.aeronautics_run=1.3.2+mc1.21.1
# Iris/Oculus for shader-pack testing, only with -Pshaders.run=true (matches this node's dev Sodium/Embeddium)
deps.iris=1.8.14-beta.1+1.21.1-neoforge

# KubeJS (7.x API line), an optional peer served by Golem Core's dev.golem.core.kubejs adapter (no KubeJS code in this
# mod). Dev runs only, with `-Pkubejs.run=true`; never compiled against, shipped or required. Blank disables it for this
# node (the `kubejs` constant). Rhino as KubeJS's POM names them.
deps.kubejs=2101.7.2-build.379
deps.kubejs_rhino=2101.2.7-build.81
deps.kubejs_architectury=
# Better Advanced Tooltips: KubeJS 7/8 load its classes at registration although their mods.toml calls it optional.
deps.kubejs_bat=2101.1.0-build.6

# Jade (block-info HUD) for dev runs with -Pjade.run=true only; HBM declares through Golem Core's
# dev.golem.core.info and never compiles against Jade.
deps.jade=15.10.6+neoforge

# Mo' Bends (bendy player and mob animations) for dev runs with -Pmobends.run=true only (Modrinth version ids): Mo' Bends
# 5.6.3 and its required Architectury API. Never shipped or required. Blank disables it for this node.
deps.mobends_run=gkZMPuSh
deps.mobends_architectury=13.0.11+neoforge
# Applied Energistics 2 for dev runs with -Pae2.run=true only; HBM reaches it through Golem Core's
# dev.golem.core.autocraft. Modrinth maven (version id where loaders share a number).
deps.ae2=19.2.18
deps.ae2_guideme=21.1.20
# ImmediatelyFast for dev runs with -Pimmediatelyfast.run=true only.
deps.immediatelyfast=1.6.15+1.21.1-neoforge
# Refined Storage 2.0.9 for dev runs with -Prefinedstorage.run=true only (Modrinth version id: both loaders share the number).
deps.refinedstorage=lHHiI26k
# Holo Inventory Modern 1.0.0 for client dev runs with -Pholoinventory.run=true only (CurseForge file id).
deps.holoinventory=9036209
