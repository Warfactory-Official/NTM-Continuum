deps.minecraft=1.21.1
deps.minecraft_range=>=1.21.1 <1.22
java_version=21
pack_format=34

deps.fabric_loader=0.19.5
deps.fabric_api=0.116.17+1.21.1

# JEI is not wired up for this node yet (1.21.1 uses the JEI 19.x API line, which differs from 26.1's
# 29.x). Leaving these blank disables the integration for this node rather than blocking the target.
deps.jei_mc=1.21.1
deps.jei=19.44.0.401
# REI (Roughly Enough Items), an optional peer like JEI: compile-only (Core dev.golem.core.rei, HBM com.hbm.handler.rei),
# in dev runs only with -Prei.run=true. Blank disables it for this node (the `rei` constant).
deps.rei=16.0.799
# REI's Fabric POM puts these at runtime scope (26.1), but REI's API names their types: compile against them too.
deps.rei_cloth=15.0.130
deps.rei_architectury=13.0.6

deps.sodium_fabric=mc1.21.1-0.8.12-fabric
# Blank: this Minecraft ships an LWJGL new enough that Loom does not upgrade it.
deps.lwjgl=
deps.gemrender=9366686
# The Flywheel GemRender nests: Loom dev runs do not load nested jars of a dependency.
deps.gemrender_flywheel=1.0.6

# Team Reborn Energy (Fabric's de-facto energy API): optional, compile-only in Core, dev-runtime only in HBM
deps.tr_energy=4.1.0

# CC: Tweaked, an optional peer: compiled against (peripherals, dev.golem.core.computer), never shipped or
# required. Blank
# disables the integration for this node (the `computercraft` constant).
deps.cc_mc=1.21.1
deps.cc=1.120.2

# Sable (moving block sub-levels), an optional peer: compiled against (src/sable + src/sable-fabric,
# com.hbm.compat.sable), never shipped or required. Blank disables it for this node. Create Aeronautics has no Fabric
# build; Sable's own /sable assemble makes sub-levels here.
deps.sable_mc=1.21.1
deps.sable=2.0.6
deps.sable_companion=1.6.0
# Iris/Oculus for shader-pack testing, only with -Pshaders.run=true (matches this node's dev Sodium/Embeddium)
deps.iris=1.8.14-beta.1+1.21.1-fabric

# KubeJS: none published for this node (2026-10-13), so blank: dev.golem.core.kubejs compiles out (the `kubejs` constant).
deps.kubejs=
deps.kubejs_rhino=
deps.kubejs_architectury=

# Jade (block-info HUD) for dev runs with -Pjade.run=true only; HBM declares through Golem Core's
# dev.golem.core.info and never compiles against Jade.
# Modrinth lists 15.10.6+fabric twice (same file), so the version id names it.
deps.jade=A416FkrB
# Refined Storage 2.0.9 for dev runs with -Prefinedstorage.run=true only (Modrinth version id: both loaders share the number).
deps.refinedstorage=PMoDGaFz
# Cloth Config, which Refined Storage requires on Fabric (with Team Reborn Energy, already in dev runs).
deps.refinedstorage_cloth=HpMb5wGb
# Just Enough Characters (pinyin search) for dev runs with -Pjecharacters.run=true only; a Modrinth version id.
deps.jecharacters=FSmEjYyr
