deps.minecraft=26.1.2
deps.minecraft_range=[26.1.2, 26.2)
java_version=25
pack_format=84

deps.neoforge=26.1.2.114
# The oldest NeoForge the released jar accepts (its neoforge.mods.toml floor); blank = deps.neoforge. 109 because KubeJS
# 8.0.6 crashes with 110+ (see deps.neoforge_kubejs), so a KubeJS pack can run 109 until KubeJS releases its fix.
deps.neoforge_floor=26.1.2.109
deps.neoforge_loader_range=[4,)

deps.jei_mc=26.1.2
deps.jei=29.43.0.107
# REI (Roughly Enough Items), an optional peer like JEI: compile-only (Core dev.golem.core.rei, HBM com.hbm.handler.rei),
# in dev runs only with -Prei.run=true. Blank disables it for this node (the `rei` constant).
deps.rei=26.1.819

deps.sodium_neoforge=mc26.1.2-0.9.2-neoforge
deps.gemrender=9302431
deps.gemrender_flywheel=
deps.pipez=neoforge-1.2.31+26.1.2

# CC: Tweaked, an optional peer: compiled against (peripherals, dev.golem.core.computer), never shipped or
# required. Blank
# disables the integration for this node (the `computercraft` constant).
deps.cc_mc=26.1.2
deps.cc=1.120.0

# The happy-ghast Fat Man (src/happyghast, com.hbm.compat.happyghast): a happy ghast carries a rigged Fat Man as it
# carries a boat. Happy ghasts exist from Minecraft 1.21.6, so only these nodes set it.
feature.happy_ghast=true
# Iris/Oculus for shader-pack testing, only with -Pshaders.run=true (matches this node's dev Sodium/Embeddium)
deps.iris=1.11.4+26.1-neoforge

# KubeJS (8.x API line), an optional peer served by Golem Core's dev.golem.core.kubejs adapter (no KubeJS code in this
# mod). Dev runs only, with `-Pkubejs.run=true`; never compiled against, shipped or required. Blank disables it for this
# node (the `kubejs` constant). Rhino as KubeJS's POM names them.
deps.kubejs=26.1.2-8.0.6
# The NeoForge a -Pkubejs.run=true dev run uses instead of deps.neoforge (also the metadata floor of that run's jars).
# KubeJS 8.0.6's WorldLoaderMixin targets vanilla's 4-argument RegistryDataLoader.load; NeoForge 26.1.2.110 patched that
# call to 5 arguments, so later builds crash on the first world load ("Scanned 0 target(s)"). 109 is the newest that works
# (JEI needs 99+). KubeJS's source already targets the 5-argument call: blank this once a release with it is out.
# Release jars are unaffected.
deps.neoforge_kubejs=26.1.2.109
deps.kubejs_rhino=2101.2.8-build.91
deps.kubejs_architectury=
# Better Advanced Tooltips: KubeJS 7/8 load its classes at registration although their mods.toml calls it optional.
deps.kubejs_bat=2601.1.0-build.11

# Jade (block-info HUD) for dev runs with -Pjade.run=true only; HBM declares through Golem Core's
# dev.golem.core.info and never compiles against Jade.
deps.jade=26.1.12+neoforge
# Applied Energistics 2 for dev runs with -Pae2.run=true only; HBM reaches it through Golem Core's
# dev.golem.core.autocraft. Modrinth maven (version id where loaders share a number).
deps.ae2=26.1.13-beta
deps.ae2_guideme=26.1.15-beta
# Refined Storage 3.2.1 for dev runs with -Prefinedstorage.run=true only (Modrinth version id: both loaders share the number).
deps.refinedstorage=P12kjgPK
# Holo Inventory Modern 1.0.0 for client dev runs with -Pholoinventory.run=true only (CurseForge file id).
deps.holoinventory=9036211
