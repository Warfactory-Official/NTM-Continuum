16_pollution {
    # If disabled, none of the polltuion related things will work
    B:POL_00_enablePollution=true

    # Whether breaking blocks in heavy metal polluted areas will poison the player
    B:POL_01_enableLeadFromBlocks=true

    # Whether being in a heavy metal polluted area will poison the player
    B:POL_02_enableLeadPoisoning=true

    # Whether smog should be visible
    B:POL_03_enableSootFog=true

    # Whether being in a poisoned area will affect the player
    B:POL_04_enablePoison=true

    # The amount of soot required to buff naturally spawning mobs
    D:POL_05_buffMobThreshold=15.0

    # How much soot is required for smog to become visible
    D:POL_06_sootFogThreshold=35.0

    # The divisor for smog, higher numbers will require more soot for the same smog density
    D:POL_07_sootFogDivisor=120.0

    # How much does smokestack multiply soot by, with decimal values reducing the soot
    D:POL_08_smokeStackSootMult=0.8
}


